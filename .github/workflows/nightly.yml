name: Nightly

# Long randomized runs, fuzzing, an older glibc, the restart soak and the
# benchmarks (NFR-TEST-08, NFR-SEC-13, NFR-PORT-01, FR-PROC-07,
# NFR-PERF-08): daily, and by hand with smaller or larger budgets.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seed range of both randomized sim nets (SIM_SEEDS); small ranges fail the coverage check; use SIM_SEED to replay one seed"
        type: string
        default: "0..200000"
      fuzz_seconds:
        description: "Seconds of fuzzing per target"
        type: number
        default: 600
      restart_runs:
        description: "Runs of the restart tests (driver/tests/restart.rs) per restart soak job"
        type: number
        default: 20
      bench_runs:
        description: "Benchmark runs (bench --runs)"
        type: number
        default: 5
      bench_seconds:
        description: "Seconds of each measured benchmark window (bench --duration)"
        type: number
        default: 10
      bench_netem:
        description: "Run only the tc netem benchmarks (bench --netem, NFR-PERF-05), skipping every other job"
        type: boolean
        default: false

# The jobs only read the repository; only `report` writes issues, and
# only `bench-publish` writes (the `benchmarks` branch).
permissions:
  contents: read

env:
  # A scheduled run has no inputs: the defaults above.
  SIM_SEEDS: ${{ inputs.seeds || '0..200000' }}
  FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 600 }}
  RESTART_RUNS: ${{ inputs.restart_runs || 20 }}
  BENCH_RUNS: ${{ inputs.bench_runs || 5 }}
  BENCH_SECONDS: ${{ inputs.bench_seconds || 10 }}
  # The failure records link the run.
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  long-runs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: long runs (${{ matrix.arch }})
    if: ${{ !inputs.bench_netem }}
    runs-on: ${{ matrix.runner }}
    # Full budget: about 8 min on 4 cores, plus the build.
    timeout-minutes: 60
    steps:
      # Pinned by commit: the v7.0.1 tag (Node 24) as of 2026-11-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Randomized nets over SIM_SEEDS
        # Optimized, but with debug assertions and overflow checks as in
        # the per-push gate. Each seed's timer order and drain plan follow
        # from the seed, as there; a failure panics with the line that
        # replays it (`SIM_SEED=<seed> failed (timer order .., shutdown ..)`).
        # The coverage lines show how many cases the range reached.
        run: |
          set -euo pipefail
          echo "SIM_SEEDS=$SIM_SEEDS"
          cargo test --release --locked -p durchlauferhitzer-sim --test faults \
            -- random_ --nocapture 2>&1 | tee long-runs.log
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      - name: Failing seed
        if: failure()
        run: grep -E '^SIM_SEED=[0-9]+ failed' long-runs.log | cut -c1-4000 > failing-seed.txt || true
      - name: Upload the failing seed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-seed-${{ matrix.arch }}
          path: |
            failing-seed.txt
            long-runs.log
      # Every job's failure record (scripts/nightly-report.py) goes to
      # `report`, which files or updates the issue.
      - name: Failure record
        if: failure()
        run: >-
          python3 scripts/nightly-report.py record --job long-runs
          --arch "$ARCH" --run-url "$RUN_URL" --out failure.json long-runs.log
        env:
          ARCH: ${{ matrix.arch }}
      - name: Upload the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-long-runs-${{ matrix.arch }}
          path: failure.json
          if-no-files-found: ignore

  fuzz:
    name: fuzz
    if: ${{ !inputs.bench_netem }}
    runs-on: ubuntu-latest
    # Full budget: 4 x 600 s plus install and build, about 45 min.
    timeout-minutes: 90
    env:
      # The nightly is installed in this job only; the product builds with
      # the pinned stable toolchain (NFR-PORT-06).
      NIGHTLY: nightly-2026-10-31
      TARGETS: request_head chunked response_head config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build the targets
        working-directory: fuzz
        run: cargo +"$NIGHTLY" fuzz build --debug-assertions
      - name: Fuzz each target for FUZZ_SECONDS
        # Every target runs even after one fails. Bounded memory and time:
        # -rss_limit_mb for the process, -malloc_limit_mb for one
        # allocation (inputs are a few KiB, so 64 MiB in one malloc
        # is a bug) and -timeout per input; a crash, leak, OOM or timeout
        # input lands in fuzz/artifacts/<target>/. Each target's output
        # is kept in fuzz/logs/<target>.log for the failure record.
        working-directory: fuzz
        run: |
          set -uo pipefail
          status=0
          mkdir -p logs
          for t in $TARGETS; do
            echo "== $t ($FUZZ_SECONDS s)"
            # The head targets get HTTP tokens (fuzz/http.dict).
            dict=()
            case "$t" in *_head) dict=(-dict=http.dict) ;; esac
            cargo +"$NIGHTLY" fuzz run --debug-assertions "$t" -- \
              -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -malloc_limit_mb=64 -timeout=10 \
              "${dict[@]}" 2>&1 | tee "logs/$t.log" || status=1
          done
          exit "$status"
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
      - name: Failure record
        if: failure()
        run: >-
          python3 scripts/nightly-report.py record --job fuzz --arch x86_64
          --toolchain "$NIGHTLY" --run-url "$RUN_URL" --out failure.json
          fuzz/logs/*.log
      - name: Upload the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-fuzz
          path: failure.json
          if-no-files-found: ignore

  older-glibc:
    # Debian 12 (glibc 2.36): the seccomp allow-list holds for an older
    # glibc than the runners' (Task 6 runs every server under kill), and
    # the restart tests run (FR-PROC-07; owner decision 2026-11-06).
    name: older glibc (debian 12)
    if: ${{ !inputs.bench_netem }}
    runs-on: ubuntu-latest
    # About 1.5 min.
    timeout-minutes: 30
    container:
      image: debian:12
      # Docker's own seccomp profile would filter every process (the
      # tests that check "no filter" would see one, and its EPERMs could
      # hide a call missing from our allow-list). CAP_SYS_PTRACE, which
      # Docker drops, lets root read /proc/<pid>/fd of a server running
      # as nobody, as root on the host can. systempaths and AppArmor
      # unconfined make /proc/sys writable, as in ci.yml's Alpine job: the
      # restart tests write net.ipv4.tcp_migrate_req, in the container's
      # own network namespace.
      # The 65536-connection backstop test needs ~262 000 descriptors and
      # Docker's root cannot raise the hard limit (no CAP_SYS_RESOURCE).
      options: >-
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --security-opt systempaths=unconfined
        --security-opt apparmor=unconfined --cap-add SYS_PTRACE
    defaults:
      run:
        # The container's default shell is sh.
        shell: bash
    env:
      # As root in the container, so `nobody` must reach the binaries and
      # the temp dirs (driver/README.md).
      CARGO_TARGET_DIR: /tmp/target
      TMPDIR: /tmp
    steps:
      - name: Install build tools
        # gcc is only the linker against the system glibc; python3 writes
        # the failure record.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git util-linux python3
          command -v setpriv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup and the pinned toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Versions
        # A current rustup installs rust-toolchain.toml's toolchain only
        # on request.
        run: |
          rustup toolchain install
          # sed reads all of ldd's output: `head` may close the pipe
          # first, and the SIGPIPE (141) fails the step under pipefail.
          ldd --version | sed -n 1p
          rustup show
          uname -r
      - name: Driver tests under seccomp kill
        # Root-only tests run (root in the container); Landlock and
        # tcp_migrate_req (the restart tests) are required. IPv6 is not:
        # a container may have none. Every skip prints a `skipped:` line,
        # listed by the next step.
        run: |
          set -euo pipefail
          echo 1 > /proc/sys/net/ipv4/tcp_migrate_req
          cargo test -p durchlauferhitzer --locked -- --nocapture 2>&1 | tee driver-tests.log
        env:
          DURCHLAUFERHITZER_REQUIRE_ROOT: "1"
          DURCHLAUFERHITZER_REQUIRE_MIGRATE: "1"
          DURCHLAUFERHITZER_REQUIRE_LANDLOCK: "1"
          DURCHLAUFERHITZER_TEST_SECCOMP_KILL: "1"
      - name: Skips
        if: always()
        run: grep 'skipped:' driver-tests.log || echo "no skips"
      - name: Failure record
        if: failure()
        run: >-
          python3 scripts/nightly-report.py record --job older-glibc --arch x86_64
          --run-url "$RUN_URL" --out failure.json driver-tests.log
      - name: Upload the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-older-glibc
          path: failure.json
          if-no-files-found: ignore

  restart-soak:
    # The restart tests (driver/tests/restart.rs, FR-PROC-07) looped
    # RESTART_RUNS times, on glibc (the runner, the test binary run with
    # sudo as in ci.yml's root step) and on musl (Alpine, a container as
    # in ci.yml's Alpine job), so a rare lost connection is caught (owner
    # decision 2026-11-06). Every run runs; a failing test is filed once
    # per architecture, libc and test name, with how many runs it failed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, libc: glibc }
          - { arch: arm64, runner: ubuntu-24.04-arm, libc: glibc }
          - { arch: x86_64, runner: ubuntu-latest, libc: musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, libc: musl }
    name: restart soak (${{ matrix.arch }}, ${{ matrix.libc }})
    if: ${{ !inputs.bench_netem }}
    runs-on: ${{ matrix.runner }}
    # One run takes about 30 s: 20 runs about 10 min, plus the build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml (glibc)
        if: matrix.libc == 'glibc'
        run: rustup show
      - name: Start the Alpine container (musl)
        # As ci.yml's Alpine job (its comments give the reasons): no
        # Docker seccomp profile, /proc/sys writable, CAP_SYS_PTRACE,
        # IPv6 on loopback, privileged low ports, a reaping pid 1.
        if: matrix.libc == 'musl'
        run: |
          docker run -d --init --name alpine \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_PTRACE \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv6.conf.lo.disable_ipv6=0 \
            --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            -v /home/runner/work:/home/runner/work \
            -w "$GITHUB_WORKSPACE" \
            -e PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e TMPDIR=/tmp \
            alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            sleep infinity
      - name: Install build tools and the pinned toolchain (musl)
        if: matrix.libc == 'musl'
        shell: docker exec alpine sh -e {0}
        run: |
          apk add --no-cache bash curl gcc musl-dev git util-linux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          rustup toolchain install
          rustup show
      - name: Restart tests, RESTART_RUNS times (glibc)
        # Built as the runner user, run as root with sudo from driver/,
        # as ci.yml's root step does.
        if: matrix.libc == 'glibc'
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p durchlauferhitzer --test restart --no-run \
              --message-format=json \
            | grep -o '"executable":"[^"]*/deps/[^"]*"' | cut -d '"' -f 4)
          test -n "$bin"
          chmod a+x "$HOME"
          sudo sysctl -w net.ipv4.tcp_migrate_req=1
          cd driver
          {
            status=0
            for i in $(seq 1 "$RESTART_RUNS"); do
              echo "== restart soak run $i of $RESTART_RUNS"
              sudo env DURCHLAUFERHITZER_REQUIRE_ROOT=1 \
                DURCHLAUFERHITZER_REQUIRE_MIGRATE=1 \
                DURCHLAUFERHITZER_REQUIRE_IPV6=1 \
                DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 \
                TMPDIR=/tmp "$bin" --nocapture || status=1
            done
            exit "$status"
          } 2>&1 | tee ../soak.log
      - name: Restart tests, RESTART_RUNS times (musl)
        # As root in the container, from driver/ as cargo test runs it.
        if: matrix.libc == 'musl'
        run: |
          set -euo pipefail
          docker exec -e RESTART_RUNS alpine bash -c '
            set -euo pipefail
            bin=$(cargo test --locked -p durchlauferhitzer --test restart --no-run \
                --message-format=json \
              | grep -o "\"executable\":\"[^\"]*/deps/[^\"]*\"" | cut -d "\"" -f 4)
            test -n "$bin"
            echo 1 > /proc/sys/net/ipv4/tcp_migrate_req
            cd driver
            {
              status=0
              for i in $(seq 1 "$RESTART_RUNS"); do
                echo "== restart soak run $i of $RESTART_RUNS"
                DURCHLAUFERHITZER_REQUIRE_ROOT=1 DURCHLAUFERHITZER_REQUIRE_MIGRATE=1 \
                  DURCHLAUFERHITZER_REQUIRE_IPV6=1 DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 \
                  "$bin" --nocapture || status=1
              done
              exit "$status"
            } 2>&1 | tee ../soak.log'
      - name: Skips
        if: always()
        run: grep 'skipped:' soak.log || echo "no skips"
      - name: Failure record
        if: failure()
        run: >-
          python3 scripts/nightly-report.py record --job restart-soak
          --arch "$ARCH" --libc "$LIBC" --run-url "$RUN_URL" --out failure.json soak.log
        env:
          ARCH: ${{ matrix.arch }}
          LIBC: ${{ matrix.libc }}
      - name: Upload the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-restart-soak-${{ matrix.arch }}-${{ matrix.libc }}
          path: failure.json
          if-no-files-found: ignore
      - name: Stop the container
        if: always() && matrix.libc == 'musl'
        run: docker rm -f alpine

  bench:
    # The benchmarks (NFR-PERF-08, bench/README.md): the release binary
    # through the fixed scenarios, one CSV row per scenario and run,
    # uploaded for `bench-publish`. A pinned image, so the runner label
    # in the rows stays true. The bench runs as the runner user; only
    # its strace pass runs as root (`sudo -n`).
    name: bench
    if: ${{ !inputs.bench_netem }}
    runs-on: ubuntu-24.04
    # Full budget: 5 runs x 7 scenarios x about 27 s, plus one run of
    # the 1k-idle and proxy-large scenarios (about 60 s), plus the builds.
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          strace -V | sed -n 1p
      - name: Build the release binary and the bench
        run: |
          cargo build --release --locked -p durchlauferhitzer
          cargo build --release --locked --manifest-path bench/Cargo.toml
      - name: Benchmarks
        run: |
          set -euo pipefail
          # The binary was built from the run's commit: the rows' label.
          commit="${GITHUB_SHA::7}"
          export BENCH_RUNNER="gha-ubuntu-24.04-$(uname -m)"
          bench/target/release/bench --binary target/release/durchlauferhitzer --commit "$commit" \
            --out bench.csv --runs "$BENCH_RUNS" --duration "$BENCH_SECONDS" 2>&1 | tee bench.log
          # The 1k-idle and proxy-large scenarios: one run a night
          # (NFR-PERF-03, NFR-PERF-05). The bench overwrites its --out
          # file, so it writes a second CSV whose rows (not its header)
          # are appended to bench.csv.
          bench/target/release/bench --binary target/release/durchlauferhitzer --commit "$commit" \
            --out bench-idle.csv --scenarios static-small-1k-idle,proxy-large --runs 1 \
            --duration "$BENCH_SECONDS" 2>&1 | tee -a bench.log
          tail -n +2 bench-idle.csv >> bench.csv
      - name: Upload the results
        # Rows with errors too: they are kept, marked, and never charted.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench.csv
          if-no-files-found: ignore
      - name: Failure record
        if: failure()
        run: >-
          python3 scripts/nightly-report.py record --job bench --arch x86_64
          --run-url "$RUN_URL" --out failure.json bench.log
      - name: Upload the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-bench
          path: failure.json
          if-no-files-found: ignore

  bench-netem:
    # The tc netem benchmarks (NFR-PERF-05, bench/README.md), only when
    # dispatched with `bench_netem`: the server in its own network
    # namespace behind a veth pair with netem on both ends, as root
    # (sudo). Three settings: 50 ms delay each way, 1 % loss, and a 2 s
    # pause (every packet dropped) in each window; each setting's rows
    # are their own CSV (runner label `...-netem-<setting>`), uploaded as
    # `bench-netem-results` and never published.
    name: bench netem
    if: ${{ inputs.bench_netem }}
    runs-on: ubuntu-24.04
    # 3 settings x 3 scenarios x BENCH_NETEM_RUNS (3) x about 30 s, plus
    # the builds.
    timeout-minutes: 40
    env:
      BENCH_NETEM_RUNS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install strace, check netem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace iproute2
          sudo modprobe sch_netem || true
          sudo ip netns add dlh-netem-probe
          sudo ip -n dlh-netem-probe link set lo up
          sudo tc -n dlh-netem-probe qdisc add dev lo root netem delay 1ms
          sudo ip netns del dlh-netem-probe
      - name: Build the release binary and the bench
        run: |
          cargo build --release --locked -p durchlauferhitzer
          cargo build --release --locked --manifest-path bench/Cargo.toml
      - name: Netem benchmarks
        # Every setting runs, even after one fails.
        run: |
          set -uo pipefail
          status=0
          netem() {
            local label=$1 spec=$2 pause=${3:-}
            echo "== netem $label: $spec ${pause:+pause $pause s}"
            sudo env BENCH_RUNNER="gha-ubuntu-24.04-$(uname -m)-netem-$label" \
              bench/target/release/bench --binary target/release/durchlauferhitzer \
              --commit "${GITHUB_SHA::7}" \
              --out "netem-$label.csv" --runs "$BENCH_NETEM_RUNS" --duration "$BENCH_SECONDS" \
              --scenarios static-large,proxy-small,proxy-large \
              --netem "$spec" ${pause:+--pause "$pause"} || status=1
          }
          # The log through tee without a subshell around the calls, so
          # `status` survives them.
          exec > >(tee bench-netem.log) 2>&1
          netem delay50ms "delay 50ms"
          netem loss1pct "loss 1%"
          netem pause2s "limit 1000" 2
          exit "$status"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-netem-results
          path: |
            netem-*.csv
            bench-netem.log
          if-no-files-found: ignore

  bench-publish:
    # Appends the `bench` artifact's rows to results.csv on the
    # `benchmarks` branch (created as an orphan branch if missing) and
    # renders BENCHMARKS.md (NFR-PERF-08). The only job that writes the
    # repository (the built-in token, no other secret). It runs no code
    # under test: only the `benchmarks` branch is checked out, plus
    # scripts/bench-chart.py (stdlib Python) from the run's commit; the
    # artifact's rows are untrusted and the script checks every field
    # before it enters the CSV or the page, and takes only rows of the
    # run's own commit dated within a day of the run. The token is passed only to
    # the git commands that fetch and push (`-c`), never stored on disk
    # while the script runs. Rows with errors are published too (never
    # charted), so it also runs after a failing `bench`.
    # Only runs of the default branch with the default bench budget
    # publish (NFR-PERF-08): a schedule always is one (it has no inputs);
    # a manual run's ref is checked, and its `bench_runs` and
    # `bench_seconds` must be the defaults above (5 and 10; keep the two
    # in step). A dispatch from another branch, or one with a lowered or
    # raised budget, keeps its rows as the `bench-results` artifact only,
    # so experiments never mix into the daily medians.
    # One publish at a time (`concurrency`): GitHub keeps one pending run
    # per group, so a newer pending publish replaces an older pending one
    # (its rows are lost). Harmless with one nightly a day; avoid
    # starting several manual runs back to back.
    name: bench publish
    needs: bench
    if: >-
      ${{ always()
      && (needs.bench.result == 'success' || needs.bench.result == 'failure')
      && (github.event_name == 'schedule'
      || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && inputs.bench_runs == 5 && inputs.bench_seconds == 10)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bench-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: scripts/bench-chart.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # A pattern: no artifact (a `bench` that failed before writing
      # one) downloads nothing and succeeds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-results
          path: artifact
      - name: Check out the benchmarks branch
        run: |
          set -euo pipefail
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q pages
          cd pages
          git remote add origin "https://github.com/$GH_REPO"
          if git -c "$auth" ls-remote --exit-code --heads origin benchmarks >/dev/null; then
            git -c "$auth" fetch -q --depth=1 origin benchmarks
            git checkout -q -b benchmarks FETCH_HEAD
          else
            git checkout -q --orphan benchmarks
            {
              echo "# Benchmarks"
              echo
              echo "Written by the nightly workflow's \`bench publish\` job (NFR-PERF-08):"
              echo "[BENCHMARKS.md](BENCHMARKS.md) charts [results.csv](results.csv)."
              echo "The tool and the scripts are on \`main\` (\`bench/\`, \`scripts/bench-chart.py\`)."
            } > README.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Append the rows and render the page
        # No token here: the script runs without one.
        id: render
        run: |
          set -euo pipefail
          csv=$(find artifact -type f -name bench.csv | head -n 1)
          if [ -z "$csv" ]; then
            echo "no bench artifact: nothing to publish"
            exit 0
          fi
          # Only the rows of this run's commit, dated within a day of
          # today (UTC), are taken; any other row is refused.
          python3 -I tools/scripts/bench-chart.py --append "$csv" --commit "${GITHUB_SHA::7}" \
            pages/results.csv pages/BENCHMARKS.md
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Benchmarks: ${GITHUB_SHA::7} on $(date -u +%F) (run $RUN_ID)"
          echo "commit=true" >> "$GITHUB_OUTPUT"
        env:
          RUN_ID: ${{ github.run_id }}
      - name: Push
        if: steps.render.outputs.commit == 'true'
        working-directory: pages
        run: |
          set -euo pipefail
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "$auth" push -q origin HEAD:refs/heads/benchmarks
          git log -1 --format='pushed %H'
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    # A failing job files or updates a GitHub issue keyed by the
    # failure's fingerprint (NFR-TEST-08, scripts/nightly-report.py):
    # a comment on an open one, a reopened closed one, or a new one
    # labelled `nightly`, at most three per run. The only job that may
    # write issues (the built-in token, no other secret); it reads the
    # failure records and runs nothing from the checkout but the script.
    # A job ended by `timeout-minutes` concludes `cancelled`, so cancelled
    # jobs are reported too (`always()`: a run cancelled by hand files as
    # well; controller ruling 2026-11-02).
    name: report failures
    # `bench-netem` is left out: it runs only when dispatched by hand,
    # whose caller reads its result directly.
    needs: [long-runs, fuzz, older-glibc, restart-soak, bench, bench-publish]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # Reads the run's jobs (each matrix leg's conclusion).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/nightly-report.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Pinned by commit: the v8.0.2 tag as of 2026-11-01. A pattern that
      # matches nothing (only cancelled jobs) downloads nothing and
      # succeeds; the script reads a missing `failures` as no records.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-failure-*
          path: failures
      - name: File or update issues
        # A failed job that left no record (it failed before writing
        # one) still gets an issue; so does a cancelled one (timed out),
        # as `<job>|timeout-or-cancelled`. Checked per matrix leg from
        # the run's jobs (`needs` has one result per job, so a cancelled
        # leg beside a sibling's record would be missed), else from
        # `needs`.
        run: |
          printf '%s' "$NEEDS" > needs.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json \
            || rm -f jobs.json
          jobs=()
          if [ -s jobs.json ]; then jobs=(--jobs jobs.json); fi
          python3 scripts/nightly-report.py report --records failures \
            --needs needs.json "${jobs[@]}" --run-url "$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
