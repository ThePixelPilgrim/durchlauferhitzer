name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    # The same gate on both supported architectures (NFR-PORT-01).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # About 3 min.
    timeout-minutes: 45
    env:
      # The test files that run the server (the root step checks the
      # list against the files that include `support/child.rs`).
      SERVER_TESTS: budget cli containment privileges restart shutdown smoke startup systemd
    steps:
      # Pinned by commit: the v7.0.1 tag (Node 24) as of 2026-11-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Architecture
        run: uname -m
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The IPv6 and Landlock tests fail instead of skipping
          # (driver/README.md).
          DURCHLAUFERHITZER_REQUIRE_IPV6: "1"
          DURCHLAUFERHITZER_REQUIRE_LANDLOCK: "1"
      - name: Driver tests under seccomp kill
        # Every server the tests start has both layers required and
        # `seccomp_action kill` (driver/README.md): a call missing from
        # the allow-list ends the server and fails its test.
        run: |
          set -euo pipefail
          args=()
          for t in $SERVER_TESTS; do args+=(--test "$t"); done
          cargo test -p durchlauferhitzer --locked "${args[@]}"
        env:
          DURCHLAUFERHITZER_REQUIRE_IPV6: "1"
          DURCHLAUFERHITZER_REQUIRE_LANDLOCK: "1"
          DURCHLAUFERHITZER_TEST_SECCOMP_KILL: "1"
      - name: Root tests (as root; a root or tcp_migrate_req skip is a failure)
        # The test binaries that run the server are built as the runner
        # user (cargo never runs as root) and run with sudo: the privilege
        # drop's root-only cases run, and the others run the server as
        # `nobody`. The temp dirs are under /tmp and the binary must be
        # reachable for `nobody`. The list (SERVER_TESTS) must name
        # every test file that runs the server (those that include the
        # child helper,
        # `support/child.rs`), but the ones excluded with a reason, so a
        # new server test cannot miss this step. Excluded: free_port (it
        # checks the port helper and starts no server). Each binary runs
        # twice: as configured, then under seccomp kill.
        run: |
          set -euo pipefail
          read -ra tests <<< "$SERVER_TESTS"
          excluded=(free_port)
          found=$(grep -l '^#\[path = "support/child.rs"\]' driver/tests/*.rs \
            | xargs -n1 basename | sed 's/\.rs$//' | sort)
          listed=$(printf '%s\n' "${tests[@]}" "${excluded[@]}" | sed '/^$/d' | sort)
          if [ "$found" != "$listed" ]; then
            echo "test files that run the server:" $found
            echo "listed here (run or excluded):" $listed
            exit 1
          fi
          args=()
          for t in "${tests[@]}"; do args+=(--test "$t"); done
          bins=$(cargo test --locked -p durchlauferhitzer "${args[@]}" --no-run \
              --message-format=json \
            | grep -o '"executable":"[^"]*/deps/[^"]*"' | cut -d '"' -f 4)
          test "$(wc -l <<< "$bins")" -eq "${#tests[@]}"
          chmod a+x "$HOME"
          # restart.rs: queued connections move on a listener's close.
          sudo sysctl -w net.ipv4.tcp_migrate_req=1
          cd driver
          for bin in $bins; do
            for kill in 0 1; do
              echo "== $bin (seccomp kill switch: $kill)"
              sudo env DURCHLAUFERHITZER_REQUIRE_ROOT=1 \
                DURCHLAUFERHITZER_REQUIRE_MIGRATE=1 \
                DURCHLAUFERHITZER_REQUIRE_IPV6=1 \
                DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 \
                DURCHLAUFERHITZER_TEST_SECCOMP_KILL="$kill" TMPDIR=/tmp "$bin"
            done
          done
      - name: Fuzz targets compile
        # The fuzz crate (outside the workspace, test-only) on stable, so
        # a core API change cannot silently break the targets; running
        # them needs nightly (nightly.yml).
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Benchmark tool
        # The bench crate (outside the workspace, test-only; nightly.yml
        # runs it): compiles, lints clean, and its unit tests pass.
        run: |
          cargo check --manifest-path bench/Cargo.toml --locked
          cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path bench/Cargo.toml --locked
      - name: The binary links the system glibc and nothing else
        # Its NEEDED entries are exactly the system runtime: glibc and
        # libgcc_s (std's unwinder, owner decision 2026-11-05), so a new
        # native library fails here. On x86_64 glibc's dynamic loader is
        # NEEDED too; on aarch64 it is not (as of 2026-11-05).
        run: |
          set -euo pipefail
          cargo build --locked -p durchlauferhitzer
          case "$(uname -m)" in
            x86_64) runtime="libc.so.6 ld-linux-x86-64.so.2 libgcc_s.so.1" ;;
            aarch64) runtime="libc.so.6 libgcc_s.so.1" ;;
            *) echo "unknown architecture: $(uname -m)"; exit 1 ;;
          esac
          readelf -d target/debug/durchlauferhitzer | tee dynamic.txt
          sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p' dynamic.txt | sort > needed.txt
          printf '%s\n' $runtime | sort > expected.txt
          diff expected.txt needed.txt
      - name: Product dependency check
        run: scripts/check-product-deps.sh
      - name: Product dependency check self-test
        run: scripts/test-check-product-deps.sh
      - name: Nightly report and bench chart script tests
        # The fingerprint and issue decision of nightly.yml's `report`
        # job (NFR-TEST-08) and the benchmark page (NFR-PERF-08); once
        # per workflow.
        if: matrix.arch == 'x86_64'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  alpine:
    # musl (NFR-PORT-02): the build, the tests and the seccomp allow-list
    # on Alpine, as root, with and without the kill switch, and the OpenRC
    # script end to end (FR-PROC-07).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: alpine (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # About 3 min.
    timeout-minutes: 30
    # Not a job `container:`: the runner cannot run JavaScript actions
    # (checkout) inside an Alpine container on arm64, so checkout runs on
    # the host and the steps run in a container started by hand, with the
    # work directory mounted at the same path (the documented workaround).
    defaults:
      run:
        shell: docker exec alpine sh -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the Alpine container
        # Alpine 3.24.3 (musl 1.2.6), pinned by digest (the multi-arch
        # index) as of 2026-11-05. As the nightly Debian job: no Docker
        # seccomp profile (it would filter every process and hide a call
        # missing from our allow-list), CAP_SYS_PTRACE (root reads
        # /proc/<pid>/fd of a server running as nobody).
        # systempaths=unconfined makes /proc/sys writable: the restart
        # tests and the reload helper write net.ipv4.tcp_migrate_req, in
        # the container's own network namespace; AppArmor unconfined, as
        # Docker's profile denies writes to /proc/sys. Its loopback gets
        # IPv6, and ports below 1024 are privileged again (Docker opens
        # them to every user), so the privileges test runs.
        # --init: a reaping pid 1, so the servers the tests and OpenRC
        # stop leave no zombies.
        shell: bash
        run: |
          docker run -d --init --name alpine \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_PTRACE \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv6.conf.lo.disable_ipv6=0 \
            --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            -v /home/runner/work:/home/runner/work \
            -w "$GITHUB_WORKSPACE" \
            -e PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e TMPDIR=/tmp \
            alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            sleep infinity
      - name: Install build tools
        # gcc is only the linker against the system musl; bash runs the
        # dependency check; util-linux has setarch, setpriv and prlimit
        # for the tests; openrc and curl the OpenRC test.
        run: |
          apk add --no-cache bash curl gcc musl-dev git util-linux openrc
          command -v setpriv prlimit setarch
      - name: Install rustup and the pinned toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          rustup toolchain install
      - name: Versions
        run: |
          rustup show
          ldd --version 2>&1 | head -n2 || true
          uname -rm
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The binary links the system musl and nothing else
        # .cargo/config.toml: -crt-static, so the binary needs libc.musl.
        # Its NEEDED entries are exactly the system runtime: musl and
        # libgcc_s (std's unwinder, owner decision 2026-11-05), so a new
        # native library fails here.
        run: |
          cargo build --locked -p durchlauferhitzer
          readelf -d /tmp/target/debug/durchlauferhitzer | tee dynamic.txt
          sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p' dynamic.txt | sort > needed.txt
          printf '%s\n' "libc.musl-$(uname -m).so.1" libgcc_s.so.1 | sort > expected.txt
          diff expected.txt needed.txt
      - name: Test (as root)
        # Root-only tests run (root in the container); a root,
        # tcp_migrate_req, Landlock or IPv6 skip is a failure. Every skip
        # prints a `skipped:` line, listed by the Skips step.
        run: |
          set -o pipefail
          DURCHLAUFERHITZER_REQUIRE_ROOT=1 DURCHLAUFERHITZER_REQUIRE_MIGRATE=1 \
            DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 DURCHLAUFERHITZER_REQUIRE_IPV6=1 \
            cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | tee tests.log
      - name: Driver tests under seccomp kill (as root)
        # Every server the tests start has `seccomp_action kill`: a call
        # missing from the musl allow-list ends it and fails its test.
        run: |
          set -o pipefail
          DURCHLAUFERHITZER_REQUIRE_ROOT=1 DURCHLAUFERHITZER_REQUIRE_MIGRATE=1 \
            DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 DURCHLAUFERHITZER_REQUIRE_IPV6=1 \
            DURCHLAUFERHITZER_TEST_SECCOMP_KILL=1 \
            cargo test -p durchlauferhitzer --locked --no-fail-fast -- --nocapture 2>&1 \
            | tee kill-tests.log
      - name: Skips
        if: always()
        run: cat tests.log kill-tests.log 2>/dev/null | grep 'skipped:' || echo "no skips"
      - name: Product dependency check
        run: scripts/check-product-deps.sh
      - name: OpenRC end to end
        # Installs the script and starts, reloads (binary replaced in
        # place), checks status and descriptors, stops (contrib/README.md).
        run: contrib/test-openrc.sh /tmp/target/debug/durchlauferhitzer
      - name: Stop the container
        if: always()
        shell: bash
        run: docker rm -f alpine
