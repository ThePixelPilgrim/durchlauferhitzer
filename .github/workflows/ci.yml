name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    # The same gate on both supported architectures (NFR-PORT-01).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      # Pinned by commit: the v4 tag (= v4.4.0) as of 2026-10-29.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Architecture
        run: uname -m
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The IPv6 tests fail instead of skipping (driver/README.md).
          DURCHLAUFERHITZER_REQUIRE_IPV6: "1"
      - name: Root tests (as root; a root skip is a failure)
        # The test binaries that run the server are built as the runner
        # user (cargo never runs as root) and run with sudo: the privilege
        # drop's root-only cases run, and the others run the server as
        # `nobody`. The temp dirs are under /tmp and the binary must be
        # reachable for `nobody`. The list must name every test file
        # that runs the server (those that include the child helper,
        # `support/child.rs`), but the ones excluded with a reason (none
        # yet), so a new server test cannot miss this step.
        run: |
          set -euo pipefail
          tests=(budget cli privileges shutdown smoke startup systemd)
          excluded=()
          found=$(grep -l '"support/child.rs"' driver/tests/*.rs \
            | xargs -n1 basename | sed 's/\.rs$//' | sort)
          listed=$(printf '%s\n' "${tests[@]}" "${excluded[@]}" | sed '/^$/d' | sort)
          if [ "$found" != "$listed" ]; then
            echo "test files that run the server:" $found
            echo "listed here (run or excluded):" $listed
            exit 1
          fi
          args=()
          for t in "${tests[@]}"; do args+=(--test "$t"); done
          bins=$(cargo test --locked -p durchlauferhitzer "${args[@]}" --no-run \
              --message-format=json \
            | grep -o '"executable":"[^"]*/deps/[^"]*"' | cut -d '"' -f 4)
          test "$(wc -l <<< "$bins")" -eq "${#tests[@]}"
          chmod a+x "$HOME"
          cd driver
          for bin in $bins; do
            echo "== $bin"
            sudo env DURCHLAUFERHITZER_REQUIRE_ROOT=1 \
              DURCHLAUFERHITZER_REQUIRE_IPV6=1 TMPDIR=/tmp "$bin"
          done
      - name: Product dependency check
        run: scripts/check-product-deps.sh
      - name: Product dependency check self-test
        run: scripts/test-check-product-deps.sh
      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
