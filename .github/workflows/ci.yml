name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    # The same gate on both supported architectures (NFR-PORT-01).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # The test files that run the server (the root step checks the
      # list against the files that include `support/child.rs`).
      SERVER_TESTS: budget cli containment privileges shutdown smoke startup systemd
    steps:
      # Pinned by commit: the v7.0.1 tag (Node 24) as of 2026-11-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Architecture
        run: uname -m
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The IPv6 and Landlock tests fail instead of skipping
          # (driver/README.md).
          DURCHLAUFERHITZER_REQUIRE_IPV6: "1"
          DURCHLAUFERHITZER_REQUIRE_LANDLOCK: "1"
      - name: Driver tests under seccomp kill
        # Every server the tests start has both layers required and
        # `seccomp_action kill` (driver/README.md): a call missing from
        # the allow-list ends the server and fails its test.
        run: |
          set -euo pipefail
          args=()
          for t in $SERVER_TESTS; do args+=(--test "$t"); done
          cargo test -p durchlauferhitzer --locked "${args[@]}"
        env:
          DURCHLAUFERHITZER_REQUIRE_IPV6: "1"
          DURCHLAUFERHITZER_REQUIRE_LANDLOCK: "1"
          DURCHLAUFERHITZER_TEST_SECCOMP_KILL: "1"
      - name: Root tests (as root; a root skip is a failure)
        # The test binaries that run the server are built as the runner
        # user (cargo never runs as root) and run with sudo: the privilege
        # drop's root-only cases run, and the others run the server as
        # `nobody`. The temp dirs are under /tmp and the binary must be
        # reachable for `nobody`. The list (SERVER_TESTS) must name
        # every test file that runs the server (those that include the
        # child helper,
        # `support/child.rs`), but the ones excluded with a reason, so a
        # new server test cannot miss this step. Excluded: free_port (it
        # checks the port helper and starts no server). Each binary runs
        # twice: as configured, then under seccomp kill.
        run: |
          set -euo pipefail
          read -ra tests <<< "$SERVER_TESTS"
          excluded=(free_port)
          found=$(grep -l '"support/child.rs"' driver/tests/*.rs \
            | xargs -n1 basename | sed 's/\.rs$//' | sort)
          listed=$(printf '%s\n' "${tests[@]}" "${excluded[@]}" | sed '/^$/d' | sort)
          if [ "$found" != "$listed" ]; then
            echo "test files that run the server:" $found
            echo "listed here (run or excluded):" $listed
            exit 1
          fi
          args=()
          for t in "${tests[@]}"; do args+=(--test "$t"); done
          bins=$(cargo test --locked -p durchlauferhitzer "${args[@]}" --no-run \
              --message-format=json \
            | grep -o '"executable":"[^"]*/deps/[^"]*"' | cut -d '"' -f 4)
          test "$(wc -l <<< "$bins")" -eq "${#tests[@]}"
          chmod a+x "$HOME"
          cd driver
          for bin in $bins; do
            for kill in 0 1; do
              echo "== $bin (seccomp kill switch: $kill)"
              sudo env DURCHLAUFERHITZER_REQUIRE_ROOT=1 \
                DURCHLAUFERHITZER_REQUIRE_IPV6=1 \
                DURCHLAUFERHITZER_REQUIRE_LANDLOCK=1 \
                DURCHLAUFERHITZER_TEST_SECCOMP_KILL="$kill" TMPDIR=/tmp "$bin"
            done
          done
      - name: Fuzz targets compile
        # The fuzz crate (outside the workspace, test-only) on stable, so
        # a core API change cannot silently break the targets; running
        # them needs nightly (nightly.yml).
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Product dependency check
        run: scripts/check-product-deps.sh
      - name: Product dependency check self-test
        run: scripts/test-check-product-deps.sh
      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
