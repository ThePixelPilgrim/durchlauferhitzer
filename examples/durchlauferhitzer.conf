# durchlauferhitzer example configuration
#
# Syntax: `key value...;` sets something, `name args... { ... }` opens a block,
# `#` starts a comment. A setting without a value is a flag (`strip_prefix;`).
# Values containing spaces or `; { } # "` go in double quotes.
# Unknown keys, duplicates and contradictions stop startup with line:column.

# This file runs as it is, as any non-root user, on loopback port 8080
# (see README.md, "Try it"): create its three roots (two static, one
# `internal_files`) first,
#     mkdir -p /tmp/durchlauferhitzer/www /tmp/durchlauferhitzer/well-known \
#              /tmp/durchlauferhitzer/protected
# Every user can write to /tmp: on a shared machine use roots you own
# instead (another user could create /tmp/durchlauferhitzer, or a symlink
# there, first). For a real site, change the addresses, the host names
# and the roots.

# Addresses to listen on (one or more), bound in this order. Keep it on
# loopback until you trust the server. An IPv6 address accepts IPv6 only,
# so IPv4 needs its own address: `listen 127.0.0.1:8080 [::1]:8080;` serves
# both (on a host with IPv6). Under systemd socket activation every address
# here must match one passed socket, and every socket an address.
listen 127.0.0.1:8080;

# Drop root privileges to this user right after binding. Required when the
# server starts as root (to bind a port below 1024): it refuses to keep
# running as root. Leave it out when starting as a normal user, or under
# systemd with `User=` (as a normal user it is ignored, which is logged).
# user www-data;

# Optional limits; every key has a conservative default (shown here).
#
# Caps: max_connections 1-65536; max_connections_per_ip 1 to max_connections
# (unset: 64, or max_connections if smaller);
# max_request_line at most max_head; max_head at most 1MiB; max_headers
# 1-1000; every duration 1ms-24h (written as 1440m or 86400s at most);
# disk_threads 1-64; memory_limit 1MiB-1024GiB; ipv6_prefix 32-128;
# backend_idle_max 1 to max_connections (unset: 8, or max_connections if
# smaller).
#
# Memory budget: at load the server checks
#     max_connections x (bytes one connection can hold) <= memory_limit
# and refuses to start if not (the error names both numbers). One
# connection holds
#     receive buffer  max(max_head, max_request_line + 2)
#   + send buffer     1KiB
# and, only if some route is a proxy, also
#   + backend receive buffer  max(32KiB, max_head)
#   + head buffer             max_head + max_headers + 128
#                             + the longest internal_files hints: 29
#                             bytes for x-sendfile, 56 + root + prefix
#                             for x-accel-redirect (0 without any)
#                             + 401 for a sent file's own headers
#                             (only with internal_files).
# With the defaults below: 16384 + 1024 = 17408 bytes without a proxy
# route, 17408 + 32768 + (16384 + 100 + 128) = 66788 bytes with one, and
# with this file's internal_files route (hints 56 + 32 + 11 = 99 bytes)
# 66788 + 99 + 401 = 67288 bytes.
# 1024 x 67288 = 68902912 bytes (about 66MiB), far below the 1GiB
# memory_limit. Raising max_connections to 65536 with max_head 1MiB would
# need about 192GiB with a proxy, so it is refused unless memory_limit
# (at most 1024GiB) is raised too.
# memory_limit counts each connection's own buffers only. Not counted: the
# send buffers of refused connections, the 4KiB scratch buffer shared by
# lingering connections, and the driver's buffers (disk readahead, the log
# buffer).
limits {
  max_connections 1024;        # open connections in total
  max_connections_per_ip 64;   # open connections per client address
  max_request_line 8KiB;       # longest request line
  max_head 16KiB;              # request line + all headers (at most 1MiB)
  max_headers 100;             # number of header lines
  memory_limit 1GiB;           # budget for the per-connection buffers
  disk_threads 4;              # threads that open and read ahead files
  shutdown_timeout 30s;        # graceful shutdown, then connections are cut
  restart_timeout 10m;         # restart drain (SIGHUP), then connections are cut
  header_timeout 10s;          # total time to receive a request head
  keepalive_timeout 60s;       # idle time between requests on one connection
  send_idle_timeout 30s;       # max time without progress while sending
  backend_connect_timeout 5s;  # proxy: time to connect to a backend
  backend_response_timeout 60s; # proxy: from the whole request written to
                               # the backend until its response head is
                               # complete; also at most this long for each
                               # head (a 1xx too) from its own first byte,
                               # even while the request body still streams
  body_idle_timeout 30s;       # proxy: max time without body progress in
                               # either direction (while the request body
                               # streams, response head bytes from the
                               # backend count as progress too)
  backend_idle_timeout 2s;     # proxy: an idle pooled backend connection
                               # is closed after this long (keep it well
                               # below the backend's own keep-alive timeout)
  backend_idle_max 8;          # proxy: at most this many idle pooled
                               # connections per backend (the newest are
                               # reused first)
  ipv6_prefix 64;              # IPv6 clients are grouped by this many
                               # leading bits for max_connections_per_ip
                               # (NAT64 64:ff9b::/96 clients count as
                               # their IPv4 address)
}

# Optional containment: how strictly the server confines itself. Each layer
# is `required` (a missing or partly supported layer stops startup, exit 2),
# `best_effort` (used where the kernel supports it, otherwise logged as
# missing and served) or `off` (skipped, said so in the startup log). On a
# kernel without Landlock or seccomp, write `best_effort` for that layer on
# purpose. Top level only; the values shown are the defaults.
containment {
  landlock required;           # file system access limit
  seccomp required;            # system call filter
  seccomp_action kill;         # an unexpected call: `kill` ends the process,
                               # `fail` returns an error and keeps serving;
                               # an error together with `seccomp off`
}

# One block per site; list every name it answers to. Requests for other
# names get 404.
host example.com www.example.com {

  # Route prefixes are path segments: `path /api` and `path /api/` are the
  # same route; it matches /api, /api/ and /api/x but never /apix. The route
  # with the most segments wins.

  # Static files. The route's own prefix is stripped (`/` here, so nothing).
  # Directories serve their index.html; dotfiles below a route — any name
  # starting with `.` — are never served (404).
  #
  # on_file_change: what happens when a file changes while it is being sent
  # (the headers, with its size, are already out, so a failure cuts the
  # connection and is logged):
  #   abort         any change since open — growth, rewrite or shrink —
  #                 cuts the connection (the default);
  #   allow_growth  a file that only got larger keeps being sent at the size
  #                 seen at open (for logs being appended to); a rewrite at
  #                 the same size or a shrink still aborts. Caveat: a rewrite
  #                 that also makes the file larger looks like growth and is
  #                 accepted.
  path / {
    static /tmp/durchlauferhitzer/www;
    on_file_change abort;
  }

  # Dotfiles can only be served through an explicit route that names them,
  # e.g. `.well-known` for ACME challenges or security.txt:
  # /.well-known/acme-challenge/abc →
  # /tmp/durchlauferhitzer/well-known/acme-challenge/abc.
  # Dotfiles *inside* it (/.well-known/.secret) are still 404.
  path /.well-known {
    static /tmp/durchlauferhitzer/well-known;
    on_file_change abort;          # static routes only; `abort` if absent
  }

  # Reverse proxy to a backend. Nothing listens on 127.0.0.1:3000 here, so
  # /api answers 502 until a backend does.
  #
  # Backend connections are pooled: after a complete keep-alive response
  # (HTTP/1.1, no `Connection: close`, a Content-Length or chunked body,
  # nothing more sent; never after a response to HEAD, a 204 or a 304)
  # the connection stays open, idle, and the next
  # request to the same backend, from any client, reuses it (the newest
  # first). An idle connection that the backend writes to or closes is
  # closed at once; see backend_idle_timeout and backend_idle_max above.
  # Requests from HTTP/1.0 clients always get a fresh connection. If a
  # reused connection turns out dead before any response byte, a GET or
  # HEAD without a body is sent once more on a fresh connection (logged
  # as kind=backend_retried); anything else gets the 502 below. Write
  # `pool off;` in a route whose backend keeps state per connection.
  #
  # Toward the backend: the request line keeps the method, the (stripped)
  # path, the query and the client's HTTP version. Hop-by-hop headers are
  # removed: Connection and every header it names, Keep-Alive, Proxy-*,
  # TE, Trailer, Upgrade and Expect. Host is passed on unchanged;
  # X-Forwarded-For gets the client address appended (or is set to it; a
  # request with two X-Forwarded-For lines is a 400); X-Forwarded-Proto is
  # set to `http`, replacing any client value; the client's Forwarded,
  # X-Real-IP, X-Forwarded-Host and X-Forwarded-Port are removed, so the
  # backend sees only identity headers the proxy set (it should still
  # trust only the last X-Forwarded-For entry); Connection: close is added
  # only with `pool off` or for an HTTP/1.0 client;
  # Content-Length is re-written without leading zeros, a chunked body
  # stays chunked. Header names go out in lower case.
  #
  # Toward the client: the same hop-by-hop headers are removed, the status
  # line becomes `HTTP/1.1 <code> <backend's reason>`, Connection: close is
  # added when the client connection will close (for example after a
  # response that ends when the backend closes), and Date, Server and
  # Content-Length pass through as the backend sent them. Header names go
  # out in lower case here too. 1xx heads other than 101 are dropped. An
  # HTTP/1.0 client cannot take Transfer-Encoding: its request goes out as
  # HTTP/1.0, and a backend response naming any Transfer-Encoding (with a
  # body or not) is answered 502.
  #
  # Expect: `100-continue` is answered by the server itself (once the
  # backend is connected) and never forwarded; any other value is a 417.
  # Outside proxy routes no `100 Continue` is ever sent.
  #
  # What the client sees when something goes wrong:
  #   400  invalid chunked framing in the request body bytes that arrived
  #        with the request head (nothing is forwarded);
  #   413  a Content-Length over max_request_body (nothing is forwarded);
  #   408  the client stalls its request body for body_idle_timeout before
  #        the response head;
  #   502  the backend refused the connection, reset or closed it before
  #        its response head was complete, or sent a malformed or oversized
  #        head, a 101, more than eight 1xx heads, a Content-Length over
  #        max_response_body, or bad body bytes along with its head;
  #   504  the connect took backend_connect_timeout, the response head did
  #        not come within backend_response_timeout of the whole request
  #        being written, or of the first byte of a response head (final
  #        or 1xx) that it did not complete (even while the request body
  #        still streams), or the backend stopped taking the request body
  #        for body_idle_timeout.
  # Once the response head has reached the client, a failure can no longer
  # be answered: the connection is simply cut, so the client sees an
  # incomplete response, never a short "complete" one. That happens when
  # the backend resets or closes mid-body, breaks chunked framing, passes
  # max_response_body, or sends no body byte for body_idle_timeout, and
  # when the client takes no byte for send_idle_timeout. A request body
  # that breaks chunked framing after its head was forwarded cuts the
  # connection too, and so does a chunked body over max_request_body,
  # whenever it passes the limit (even in the bytes that arrived with the
  # head: then it is cut before any connect, with no 413). A client that
  # resets or ends its stream mid-request closes the backend connection at
  # once (an end of stream in the middle of the body is logged, since the
  # backend got a truncated request); one that only half-closes after a
  # complete request still gets the whole response.
  path /api {
    proxy 127.0.0.1:3000;          # an IP and port: 1.2.3.4:80 or [::1]:80;
                                   # host names are refused (no DNS), and
                                   # so are 0.0.0.0, [::], broadcast and
                                   # multicast; [fe80::1%2]:80 is fine
    strip_prefix;                  # backend sees /x for /api/x, / for /api
    max_request_body 10MiB;        # required: size or `unlimited`
    max_response_body unlimited;   # required: size or `unlimited`
    pool on;                       # `off`: a fresh connection per request

    # Files the backend hands over. Optional and off by default: without it
    # the backend's X-Sendfile and X-Accel-Redirect headers are never
    # honoured (and always removed). With it, a backend answer `200` that
    # carries the chosen header is replaced by that file, sent from below
    # the root by the server itself:
    #   internal_files x-sendfile <root>;
    #       X-Sendfile: the absolute path of a file below <root>;
    #   internal_files x-accel-redirect <prefix> <root>;
    #       X-Accel-Redirect: a path starting with <prefix> (which starts
    #       and ends with `/`, as in /protected/); what follows it names
    #       the file below <root>.
    # The root follows the `static` rules, and is checked and opened at
    # startup like a static root and readable under Landlock; it may use
    # visible ASCII only, without `?` (every X-Sendfile value would be a
    # 502), `=` or `,`, and the prefix without `,` (X-Accel-Mapping is
    # split on `,` and `=`). Toward the backend the server sets the hints
    # Rack-style servers look for: X-Sendfile-Type (the header's name) and,
    # with x-accel-redirect, X-Accel-Mapping (<root>/=<prefix>); clients
    # cannot send these or the file headers. A value that does not match
    # the root or prefix, or holds a `?`, an empty, `.` or `..` segment, or
    # a byte outside visible ASCII is the backend misbehaving: 502. A file
    # that is missing, a dotfile or a directory is a 404. The backend's
    # body is discarded; the client gets the file as a static route sends
    # it (Content-Length, ETag, Last-Modified from the file, conditional
    # and single-range requests, HEAD), with the backend's Content-Type and
    # other headers. on_file_change (see the static routes) applies to the
    # sent file; `abort` if absent, and an error without internal_files.
    internal_files x-accel-redirect /protected/ /tmp/durchlauferhitzer/protected;
    on_file_change abort;
  }
}
