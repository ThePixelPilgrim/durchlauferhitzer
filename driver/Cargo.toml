[package]
name = "durchlauferhitzer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The durchlauferhitzer binary: the Linux epoll driver for the sans-IO core."

[lib]
path = "src/lib.rs"

[[bin]]
name = "durchlauferhitzer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
durchlauferhitzer-core = { path = "../core" }
libc = { version = "0.2.191", default-features = false }

# Test-only. socket2 builds sockets the product never builds, without
# `unsafe` in the tests (NFR-MAINT-05): systemd.rs's dual-stack IPv6
# listener clears `IPV6_V6ONLY` before bind, whatever the host default.
[dev-dependencies]
socket2 = { version = "0.6.5", default-features = false }

# `sys::env::remove_vars` works only while the process has one thread,
# and libtest always runs tests on threads of their own: this test has
# its own `main` (no harness).
[[test]]
name = "env_remove"
harness = false

# `sys::seccomp::install` filters the whole process: one test in its own
# process, with its own `main`.
[[test]]
name = "seccomp_self"
harness = false

# `sys::landlock::restrict_to_reading` restricts the whole process: a
# child (this binary again) restricts itself, the parent cleans up.
[[test]]
name = "landlock_self"
harness = false

# The real allow-list in a child process (this binary again): an abort
# still dies by SIGABRT, `fstat` works.
[[test]]
name = "seccomp_program"
harness = false
