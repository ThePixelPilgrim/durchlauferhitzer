[package]
name = "durchlauferhitzer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The durchlauferhitzer binary: the Linux epoll driver for the sans-IO core."

[lib]
path = "src/lib.rs"

[[bin]]
name = "durchlauferhitzer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
durchlauferhitzer-core = { path = "../core" }
libc = { version = "0.2.191", default-features = false }

# `sys::env::remove_vars` works only while the process has one thread,
# and libtest always runs tests on threads of their own: this test has
# its own `main` (no harness).
[[test]]
name = "env_remove"
harness = false
