[package]
name = "keyd"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
sha2 = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
