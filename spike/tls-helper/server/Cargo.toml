[package]
name = "server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libc = { version = "0.2", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
# baseline (in-process handshake) only:
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
spike-provider = { path = "../provider" }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
